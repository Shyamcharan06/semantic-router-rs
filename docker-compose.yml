services:
  mock-backend:
    build:
      context: .
      dockerfile: eval/Dockerfile
    ports:
      - "9000:9000"

  router:
    build: .
    ports:
      - "8088:8088"
    environment:
      - ROUTER_CONFIG=/app/config/routes.yaml
      - HF_HUB_CACHE=/app/.cache/huggingface
      - RUST_LOG=info
    volumes:
      - hf-cache:/app/.cache/huggingface
      - ./config:/app/config:ro
    depends_on:
      - mock-backend

volumes:
  hf-cache:
