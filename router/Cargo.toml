[package]
name = "semantic-router"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chrono = "0.4.45"
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokenizers = "0.23.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["v4"] }
